site_name: gui2delines
site_description: Onboarding and research workflow guidelines for gui2de
site_url: https://gui2de.github.io/lines/
repo_url: https://github.com/gui2de/lines
repo_name: gui2de/lines
edit_uri: edit/master/docs/

theme:
  name: material
  logo: assets/logo-white.png
  favicon: assets/logo-white.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - assets/brand.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

plugins:
  - search
  - redirects:
      redirect_maps:
        1-software-setup/slack.md: onboarding/workflow/slack.md
        1-software-setup/zoom.md: onboarding/workflow/zoom.md
        1-software-setup/stata16.md: onboarding/tools/stata.md
        1-software-setup/server.md: onboarding/tools/index.md
        1-software-setup/arcgis.md: onboarding/tools/index.md
        2-research-ethics/IRB_indiv.md: research/ethics/citi.md
        2-research-ethics/IRB_study.md: research/ethics/irb-study.md
        2-research-ethics/IRB_amend.md: research/ethics/irb-amendments.md
        2-research-ethics/COI.md: research/ethics/coi.md
        3-data-collection/data-mapping.md: research/data-management/index.md
        3-data-collection/survey-cto.md: research/data-collection/surveycto.md
        3-data-collection/survey-writing.md: research/data-collection/survey-design.md
        3-data-collection/hfc.md: research/data-collection/hfc.md
        3-data-collection/backcheck.md: research/data-collection/backchecks.md
        3-data-collection-remote/workplan-remote.md: research/remote/workplan.md
        3-data-collection-remote/cases.md: research/remote/cases.md
        3-data-collection-remote/survey-writing-remote.md: research/remote/survey-writing.md
        3-data-collection-remote/callsheet.md: research/remote/callsheet.md
        3-data-collection-remote/training-remote.md: research/remote/training.md
        3-data-collection-remote/hfc-remote.md: research/remote/hfc.md
