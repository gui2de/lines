site_name: gui2delines
site_description: Onboarding and research workflow guidelines for gui2de
site_url: https://gui2de.github.io/lines/
repo_url: https://github.com/gui2de/lines
repo_name: gui2de/lines
edit_uri: edit/master/docs/

theme:
  name: material
  logo: assets/logo-white.png
  favicon: assets/logo-white.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - assets/brand.css

extra_javascript:
  - assets/external-links.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

plugins:
  - search

nav:
  - Home:
      - index.md
      - Intro: intro.md
  - Onboarding:
      - onboarding/index.md
      - Workflow & collaboration:
          - onboarding/workflow/index.md
